name: Build Insta Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flet and Dependencies
        run: |
          pip install flet requests

      - name: Build Android APK
        run: |
          flet build apk --project "InstaPro" --org "com.chandru.instapro"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstaPro-APK
          path: build/apk/*.apk

name: Build KPR Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
      - run: pip install flet
      - run: |
          flet create kpr_app
          cp main.py kpr_app/src/main.py
          mkdir -p kpr_app/src/assets
          cp Picsart_*.jpg kpr_app/src/assets/icon.png || true
          cd kpr_app
          flet build apk --product "KPR" --org "com.kpr.app" --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: KPR-App-APK
          path: kpr_app/build/apk/*.apk
